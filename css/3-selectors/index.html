<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CSS selectors</title>
</head>

<body>
    <h1 class="sub-title bg-green">Hello world</h1>
    <p class="sub-title">Today we will be looking at css selectors:</p>

    <div class="bg-green">
        <h1>Box 1</h1>
    </div>

    <div class="bg-yellow">
        <h1 class="sub-title">Box 2</h1>
    </div>

    <h1 id="sub-title">
        this is an id
    </h1>
</body>

</html>
